server:
  port: ${PORT:8080}

spring:
  application:
    name: quote-api
  profiles:
    active: postgres
  # 本地密钥：复制 application-secrets.yml.example → application-secrets.yml 后填写
  config:
    import: optional:file:./application-secrets.yml,optional:classpath:application-secrets.yml
  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
    show-sql: false
    properties:
      hibernate:
        jdbc:
          batch_size: 500
        order_inserts: true
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 50MB

quote:
  upload-dir: ./uploads
  cost:
    reset: ${QUOTE_COST_RESET:false}
    # 生产默认关闭：空成本库不再自动灌测试数据。本地需要样例时设 QUOTE_COST_SEED_IF_EMPTY=true
    seed-if-empty: ${QUOTE_COST_SEED_IF_EMPTY:false}
  cors:
    # 开发机可用局域网 IP 打开前端（如 http://192.168.x.x:5666）；生产请收紧
    allowed-origin-patterns: ${CORS_ALLOWED_ORIGIN_PATTERNS:http://localhost:*,http://127.0.0.1:*,http://192.168.*:*,http://10.*:*,http://172.*:*}
  # AI 助手（阿里云通义千问 DashScope OpenAI 兼容）。密钥必须用环境变量，禁止写入仓库。
  ai:
    enabled: ${QUOTE_AI_ENABLED:true}
    base-url: ${QUOTE_AI_BASE_URL:https://dashscope.aliyuncs.com/compatible-mode/v1}
    api-key: ${QUOTE_AI_API_KEY:}
    model: ${QUOTE_AI_MODEL:qwen-plus}
    max-tool-rounds: ${QUOTE_AI_MAX_TOOL_ROUNDS:3}
    rate-limit-per-minute: ${QUOTE_AI_RATE_LIMIT_PER_MINUTE:20}
  masterdata:
    us-zip:
      enabled: true
      file-path: ./US.txt
      skip-if-exists: true
    global-port:
      enabled: true
      skip-if-exists: true
      unlocode-csv-path: ./data/unlocode/code-list.csv
      unlocode-zip-path: ./data/unlocode/loc242csv.zip
      unlocode-official-zip-url: https://service.unece.org/trade/locode/loc242csv.zip
      unlocode-csv-url: https://raw.githubusercontent.com/datasets/un-locode/main/data/code-list.csv
      sync:
        enabled: true
        cron: "0 0 4 1 1,7 ?"
      freightutils:
        base-url: https://www.freightutils.com/api
        api-key:
        request-delay-ms: 350

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui
    tags-sorter: alpha
    operations-sorter: alpha
    display-request-duration: true
  show-actuator: false
